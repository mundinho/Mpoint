spring.application.name=sort

# Conexao com o MySQL via R2DBC (reativo)
spring.r2dbc.url=r2dbc:mysql://localhost:3306/sort_db
spring.r2dbc.username=root
spring.r2dbc.password=

# Executa schema.sql na inicializacao (necessario pois R2DBC nao gera DDL automaticamente)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
